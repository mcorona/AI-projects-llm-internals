name: eval-semana-14

# Semana 14. Sin API: línea base del SDK, matriz de amenazas, primitivas, transporte HTTP, Keycloak (actividad 4),
# OAuth y auth negativas (actividad 5), cliente seguro y defensas de poisoning (actividad 6), contra Postgres y un
# Keycloak efímero del job. Con API (actividad 8): mini eval del agente contra el servidor MCP remoto con OAuth,
# Haiku 5.5 low, tope de costo por corrida (semana-14/ci/eval_ci.py).
on:
  pull_request:
    paths:
      - "semana-14/**"
      - "!semana-14/**/*.md"          # documentación y resultados: no pagan una eval
      - "!semana-14/resultados/**"
      - "semana-13/agente/**"
      - "semana-13/herramientas/**"
      - ".github/workflows/eval-semana-14.yml"

permissions:
  contents: read

concurrency:   # un push nuevo cancela la corrida anterior del mismo PR (no se paga una eval que ya no cuenta)
  group: eval-semana-14-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d inventory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_DSN: postgresql://admin:ci-admin@localhost:5432/inventory
      PG_DSN: postgresql://copilot_ro:ci-ro@localhost:5432/inventory
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: pip install "psycopg[binary]==3.3.6" "pydantic==2.14.1" "sqlglot==30.26.0" "mcp==2.3.0" "jsonschema==4.26.0" "pyjwt[crypto]==2.15.1" pytest
      - name: Keycloak efímero (realm legacybridge, contraseñas aleatorias del job)
        run: semana-14/auth/arrancar.sh
      - name: Preparar base de CI (esquema, copilot_ro y datos sintéticos, semilla 42) y esquema legado
        run: |
          python semana-07/ci/preparar_base.py
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-10/legado/legado.sql
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-13/seguridad/artnot.sql
      - name: Línea base del SDK (24 comprobaciones)
        run: python semana-14/linea_base/verificar_sdk.py
      - name: Contrato, transporte, Keycloak, OAuth, auth negativas y defensas de poisoning (sin API)
        run: |
          cd semana-14 && python -m pytest -q tests -p no:cacheprovider -rs | tee /tmp/pytest.txt
          if grep -q "Keycloak no está corriendo" /tmp/pytest.txt; then echo "::error::las pruebas de Keycloak se omitieron"; exit 1; fi
      - name: Mini eval del agente contra el servidor remoto (Haiku 5.5 low, tope por corrida)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_DE_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: cd semana-14 && python ci/eval_ci.py
      - name: Detener Keycloak
        if: always()
        run: semana-14/auth/arrancar.sh --borrar
