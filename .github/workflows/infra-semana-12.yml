name: infra-semana-12

# Sin credenciales de nube: valida la sintaxis de los scripts de infra, que no haya llaves en el repo, que el paquete
# de ingesta siga congelado y que los resultados versionados de las corridas contra las nubes estén completos y sean
# consistentes (las corridas mismas solo se repiten a mano con eval-nube-semana-12).
on:
  pull_request:
    paths:
      - "semana-12/**"
      - ".github/workflows/infra-semana-12.yml"

jobs:
  revisar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sintaxis de los scripts de infra
        run: |
          for f in semana-12/infra/*.sh; do bash -n "$f" && echo "ok $f"; done
      - name: Python de infra compila
        run: python3 -m py_compile semana-12/infra/*.py
      - name: Sin credenciales en el repo
        run: bash semana-12/infra/revisar_secretos.sh
      - name: Paquete de ingesta congelado (se reconstruye idéntico y el golden no cambió)
        run: |
          python3 semana-12/ingesta/construir_paquete.py > /dev/null
          git status --porcelain semana-12/ingesta/paquete
          git diff --exit-code --stat -- semana-12/ingesta/paquete
          test -z "$(git status --porcelain semana-12/ingesta/paquete)"
      - name: Resultados versionados completos y consistentes
        run: python3 semana-12/evaluacion/validar_resultados.py
      - name: Tabla de comparación al día con los resúmenes
        run: |
          python3 semana-12/evaluacion/comparar.py > /dev/null
          git diff --exit-code --stat -- semana-12/resultados/comparacion.json semana-12/resultados/comparacion_tabla.md
