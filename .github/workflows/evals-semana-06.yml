name: evals-semana-06

on:
  pull_request:
    paths:
      - "semana-05/prompts/**"
      - "semana-05/run_prompts.py"
      - "semana-06/**"
      - "semana-07/**"
      - "semana-08/**"
      - "semana-09/**"
      - "semana-10/**"
      - "semana-11/**"
      - "semana-12/**"
      - "semana-13/**"
      - "semana-14/**"
      - "README.md"
      - "**/prompts/**"
      - ".github/workflows/evals-semana-06.yml"
      - ".github/workflows/nlq-semana-07.yml"

jobs:
  regresion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Correr evals de regresión
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python semana-06/evaluar.py
